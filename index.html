<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT UI Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-symbol">HB</div>
        </div>

        <nav class="menu">

            <a href="#" class="menu-item">
                <span class="icon">✎</span>
                <span>New chat</span>
            </a>

            <a href="#" class="menu-item">
                <span class="icon">⌕</span>
                <span>Search chats</span>
            </a>

            <a href="#" class="menu-item">
                <span class="icon">▣</span>
                <span>Library</span>
            </a>

            <a href="#" class="menu-item">
                <span class="icon">▦</span>
                <span>GPTs</span>
            </a>

            <a href="#" class="menu-item">
                <span class="icon">⊞</span>
                <span>Projects</span>
            </a>

        </nav>

        <!-- PROFILE -->
        <div class="profile">

            <div class="profile-picture">
                HK
            </div>

            <div class="profile-info">
                <div class="profile-name">Hunny Kumar</div>
                <div class="profile-plan">Go</div>
            </div>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">


            <div class="version-selector">
    <select>
        <option>Version-5.6</option>
        <option>Version-5.5</option>
        <option>Version-5</option>
        <option>Version-Go</option>
    </select>
</div>
    

        </header>


        <!-- CHAT AREA -->
        <section class="chat-container">

            <h1>how can i help you?</h1>


            <!-- INPUT BOX -->
            <div class="chat-input">

                <button class="input-button plus-button">
                    +
                </button>

                <input
                    type="text"
                    placeholder="Ask anything"
                >

                <button class="input-button microphone-button">
                    ♩
                </button>

                <button class="input-button menu-button">
                    ☰
                </button>

            </div>

        </section>

    </main>

</body>
</html>
